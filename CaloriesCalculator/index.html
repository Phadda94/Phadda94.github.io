<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calories Requirement Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculate Your Daily Calories Requirement</h1>
        
        <form id="form">
            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="">Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <div id="gender-message" class="message hidden">Please select your gender.</div>
            
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" required>
            
            <label for="height">Height (cm):</label>
            <input type="number" id="height" required>
            
            <label for="age">Age (years):</label>
            <input type="number" id="age" required>
            
            <label for="lifestyle">Lifestyle:</label>
            <select id="lifestyle">
                <option value="">Select your lifestyle</option>
                <option value="sedentary">Sedentary (little or no exercise)</option>
                <option value="light">Light (light exercise 1-3 days/week)</option>
                <option value="moderate">Moderate (moderate exercise 3-5 days/week)</option>
                <option value="active">Active (intense exercise 6-7 days/week)</option>
                <option value="very_active">Very Active (very intense physical activity)</option>
            </select>
            <div id="lifestyle-message" class="message hidden">Please select your lifestyle.</div>
            
            <button type="submit">Calculate</button>
        </form>

        <div id="result" class="hidden">
            <h2>Result:</h2>
            <p id="bmr">Your BMR: <span></span> kcal/day</p>
            <p id="totalCalories">Calories: <span></span> kcal/day</p>
            <p id="carbs">Carbs: <span></span>g/day</p>
            <p id="protein">Protein: <span></span>g/day</p>
            <p id="fat">Fat: <span></span>g/day</p>
            <p id="fiber">Fiber: <span></span>g/day</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
